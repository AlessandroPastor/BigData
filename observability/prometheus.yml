global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alertas.yml

scrape_configs:

  # ── Kafka Exporter ────────────────────────────────────────────────────────────
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
    metrics_path: /metrics

  # ── Prometheus self-monitoring ────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
