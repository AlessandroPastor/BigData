apiVersion: 1

datasources:
  - name: Prometheus
    uid: casamarket-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    uid: casamarket-pg
    type: postgres
    access: proxy
    url: postgres:5432
    database: casamarket
    user: casamarket
    secureJsonData:
      password: casamarket
    jsonData:
      database: casamarket
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    editable: false
